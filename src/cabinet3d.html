<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smoker — 3D Cabinet Preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1c1e; }
    #hint {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #d0d0d3;
      font: 13px -apple-system, sans-serif;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      z-index: 10;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hint">Drag to orbit · scroll to zoom · click a red cover to swing it open</div>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "../node_modules/three/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
  <script type="module" src="cabinet3d.js"></script>
</body>
</html>
