<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smoker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="error" class="error-banner floating" style="display:none;"></div>

  <div id="projectsView" class="cabinet-page">
    <div class="cabinet">
      <div class="cabinet-top-face"></div>
      <div class="cabinet-header">
        <span class="cabinet-logo">SMOKER</span>
        <span class="cabinet-led"></span>
      </div>
      <div class="cabinet-shelves" id="projectList"></div>
      <div class="cabinet-drawer">
        <div class="drawer-handle"></div>
        <span class="drawer-keyhole"></span>
      </div>
    </div>
  </div>

  <div id="actionOverlay" class="action-overlay" style="display:none;">
    <div class="action-panel">
      <h3 id="actionPlanName"></h3>
      <div class="action-buttons">
        <button id="actionStartBtn" class="primary">Start Run</button>
        <button id="actionResultsBtn" class="secondary">View Test Runs</button>
        <button id="actionEditBtn" class="secondary">Edit</button>
        <button id="actionDownloadBtn" class="secondary">Download</button>
        <button id="actionDeleteBtn" class="secondary danger-outline">Delete</button>
      </div>
      <button id="actionBackBtn" class="secondary action-back">← Back</button>
    </div>
  </div>

  <script src="start.js"></script>
</body>
</html>
