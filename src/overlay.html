<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smoker — Overlay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="overlay-panel">
    <div class="overlay-left">
      <div class="overlay-header">
        <span class="test-name" id="testName"></span>
        <span class="step-count" id="stepCount"></span>
      </div>
      <div class="overlay-instruction" id="instruction"></div>
      <div id="result" class="overlay-result" style="display:none;"></div>
    </div>
    <div class="overlay-right">
      <button id="prevBtn" class="secondary">‹ Prev</button>
      <button id="nextBtn" class="primary">Next Step</button>
      <button id="viewBaselineBtn" class="secondary">View Baseline</button>
      <button id="screenshotBtn" class="secondary">Take Screenshot</button>
      <button id="delayedScreenshotBtn" class="secondary span-2">Take Screenshot (2s Delay)</button>
      <button id="endBtn" class="danger span-2">End Run</button>
    </div>
  </div>
  <script src="linkify.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
